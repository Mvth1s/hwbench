[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwbench"
version = "0.2.0"
description = "Inventaire matériel et benchmarks notés en ligne de commande"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "psutil>=5.9",
    "py-cpuinfo>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
hwbench = "hwbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# référence du scoring, générée sur la machine de référence par `hwbench reference`
hwbench = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# --- Release : python-semantic-release (workflow .github/workflows/release.yml) -------------
# Version calculée à partir des conventional commits depuis le dernier tag vX.Y.Z.
[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/hwbench/__init__.py:__version__"]
build_command = "python -m pip install build && python -m build"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
# 0.x tant qu'aucune version stable n'est décidée : un changement cassant ne passe pas en 1.0
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
# « update » : les nouvelles versions s'insèrent au marqueur, l'historique écrit à la main
# (avant les conventional commits) reste en dessous
mode = "update"
insertion_flag = "<!-- version list -->"
exclude_commit_patterns = ["^chore\\(release\\):", "^Merge "]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
