name: Audit

# pip-audit chaque semaine : une vulnérabilité publiée sur une dépendance sans changement du
# dépôt. Le même audit tourne dans ci.yml (job audit) sur chaque PR et chaque push.
on:
  schedule:
    - cron: "23 5 * * 1" # lundi, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      # dépendances installées (runtime et dev), hwbench lui-même exclu (installé en éditable)
      - run: pip-audit --skip-editable
