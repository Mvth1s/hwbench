name: Release

# À chaque push sur main : python-semantic-release calcule la version à partir des conventional
# commits, met à jour pyproject.toml, src/hwbench/__init__.py et CHANGELOG.md, committe
# « chore(release): X.Y.Z », tagge vX.Y.Z, puis crée la GitHub Release avec sdist et wheel.
# Si une release a été créée : attestation de provenance des artefacts, puis publication sur
# PyPI (trusted publishing) dans un job séparé, derrière l'environnement « pypi ».
# Notifications Discord (scripts/discord_notify.py) dans des jobs à part, sans id-token :
# #releases et « PyPI en attente d'approbation » (#deploiements) dès la GitHub Release, puis
# « publié sur PyPI » (#deploiements) après le job pypi. Le job pypi ne contient que la
# publication. Un échec de notification ne fait jamais échouer la release.
# Configuration : [tool.semantic_release] dans pyproject.toml.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

# Aucune permission par défaut : chaque job déclare le strict nécessaire.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit de release, tag, GitHub Release
      id-token: write # attestation de provenance (certificat Sigstore)
      attestations: write # enregistrement de l'attestation sur le dépôt
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # semantic-release travaille sur la branche à jour, pas sur un HEAD détaché
      - name: Se placer sur le commit qui a déclenché le workflow
        env:
          SHA: ${{ github.sha }}
        run: git reset --hard "$SHA"

      # actions tierces et actions de publication épinglées par SHA de commit
      - name: Version, changelog, tag et GitHub Release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Attester la provenance de sdist et wheel
        if: steps.release.outputs.released == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Joindre sdist et wheel à la GitHub Release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@99d4062dd393b5a7a62c5fe9ed78fb364b5674f2 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Transmettre sdist et wheel au job PyPI
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    # Required reviewers sur l'environnement : la publication attend une approbation manuelle
    environment:
      name: pypi
      url: https://pypi.org/project/hwbench/
    permissions:
      id-token: write # trusted publishing (jeton OIDC échangé contre un jeton PyPI éphémère)
    steps:
      - name: Récupérer sdist et wheel du job release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publier sur PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  notify-release:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # extraction du script, lecture des notes de la GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/discord_notify.py
          sparse-checkout-cone-mode: false

      - name: Notifier #releases
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_RELEASES: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          TAG: ${{ needs.release.outputs.tag }}
        run: python3 scripts/discord_notify.py release --tag "$TAG"

      - name: Notifier #deploiements (PyPI en attente d'approbation)
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_DEPLOIEMENTS: ${{ secrets.DISCORD_WEBHOOK_DEPLOIEMENTS }}
          TAG: ${{ needs.release.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/discord_notify.py pypi-pending --version "${TAG#v}" --run-url "$RUN_URL"

  notify-pypi:
    needs: [release, pypi]
    if: needs.pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read # extraction du script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/discord_notify.py
          sparse-checkout-cone-mode: false

      - name: Notifier #deploiements (publié sur PyPI)
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_DEPLOIEMENTS: ${{ secrets.DISCORD_WEBHOOK_DEPLOIEMENTS }}
          TAG: ${{ needs.release.outputs.tag }}
        run: python3 scripts/discord_notify.py pypi-published --version "${TAG#v}"
