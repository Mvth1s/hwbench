name: Results

# Validation des résultats soumis au classement (results/<nom>.json).
# pull_request et JAMAIS pull_request_target : une PR de fork tourne avec un jeton en lecture
# seule et sans aucun secret. Le validateur vient de la branche de base, pas de la PR : une PR
# ne peut pas assouplir son propre contrôle.
on:
  pull_request:
    paths:
      - "results/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validateur (branche de base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Fichiers soumis (PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Installer hwbench depuis la branche de base
        run: pip install ./base

      # Un dossier results/ remplacé par un lien symbolique ne laisserait aucun fichier à valider.
      - name: results/ doit rester un vrai dossier
        working-directory: pr
        run: |
          if [ -L results ] || [ ! -d results ]; then
            echo "::error::results/ doit être un dossier ordinaire, pas un lien symbolique"
            exit 1
          fi

      # Noms de fichiers contrôlés par l'auteur de la PR : passés par -z / xargs -0, jamais
      # interprétés par un shell. python -I (isolé) : le dossier courant, qui est le checkout de
      # la PR, n'entre pas dans le chemin d'import ; sinon un dossier hwbench/ ajouté par la PR
      # remplacerait le validateur de la branche de base. Seuls les fichiers ajoutés, modifiés
      # ou renommés sont validés (les anciens résultats restent lisibles après un changement de
      # version de bench).
      - name: Valider les fichiers ajoutés ou modifiés
        working-directory: pr
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff -z --name-only --diff-filter=AMR "$BASE" HEAD -- results/ \
            | xargs -0 --no-run-if-empty python -I -m hwbench.leaderboard validate
