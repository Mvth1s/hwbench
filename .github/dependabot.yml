# Dependabot : PR vers dev, messages conventionnels pour passer commitlint.
version: 2
updates:
  # actions épinglées par SHA (release.yml…) : « ci(deps): … »
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope

  # dépendances Python du pyproject.toml : « build(deps): … », « build(deps-dev): … »
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
