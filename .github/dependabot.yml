# Garde à jour les actions épinglées par SHA (release.yml) : PR vers dev, messages
# conventionnels (« ci(deps): … ») pour passer commitlint.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
